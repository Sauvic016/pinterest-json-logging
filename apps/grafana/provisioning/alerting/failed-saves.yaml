apiVersion: 1

groups:
  - orgId: 1
    name: Demo feature health
    folder: Client logging
    interval: 1m
    rules:
      - uid: pin-save-failures
        title: More than 10 failed saves in 5 minutes
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        isPaused: false
        dashboardUid: client-logging
        panelId: 1
        labels:
          app: pin-demo
        annotations:
          summary: More than 10 pin_save_failed events were received in the last 5 minutes.
          description: This count covers all runs and app versions. Use the recent-events table to inspect failures.
        data:
          - refId: A
            datasourceUid: demo-postgres
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              datasource:
                type: postgres
                uid: demo-postgres
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: >-
                SELECT now() AS time, count(*)::double precision AS failures
                FROM public.events
                WHERE app = 'pin-demo' AND event_name = 'pin_save_failed'
                  AND received_at > now() - interval '5 minutes' AND received_at <= now()
              intervalMs: 60000
              maxDataPoints: 300
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
